name: Qinghe scene mobile acceptance
on:
  pull_request:
    paths:
      - 'county/**'
      - 'scripts/qinghe-*-review.mjs'
      - '.github/workflows/qinghe-scene-review.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Local map, facilities and actual NPC actions
        env:
          QINGHE_MAP_SCREENSHOT: /tmp/qinghe-scene.png
        run: node scripts/qinghe-local-map-review.mjs
      - name: Save export and import on mobile widths and landscape
        run: node scripts/qinghe-mobile-review.mjs
      - name: Offline sixteen-place acceptance
        run: node scripts/qinghe-scene-art-offline-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qinghe-scene-mobile
          path: /tmp/qinghe-scene*.png
          if-no-files-found: ignore
