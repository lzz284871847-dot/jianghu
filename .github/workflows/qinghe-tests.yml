name: Qinghe regression
on:
  pull_request:
    paths:
      - 'county/**'
      - '.github/workflows/qinghe-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check county/npc-contracts.js
          node --check county/npc-simulation.js
          node --check county/engine.js
      - name: NPC contracts focused tests
        run: node --test county/npc-contracts.test.mjs
      - name: All county tests
        run: node --test county/*.test.mjs
      - name: Legacy and foundation test group
        continue-on-error: true
        run: node --test tests/[!r]*.test.js
      - name: Rebuild test group
        continue-on-error: true
        run: node --test tests/rebuild*.test.js
      - name: Serial full repository tests
        continue-on-error: true
        run: node --test --test-concurrency=1
      - name: Full repository tests
        run: node --test --test-concurrency=1
