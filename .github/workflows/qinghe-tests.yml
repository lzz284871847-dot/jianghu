name: Qinghe regression
on:
  pull_request:
    paths:
      - 'county/**'
      - '.github/workflows/qinghe-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check county/npc-contracts.js
          node --check county/npc-simulation.js
          node --check county/engine.js
      - name: All repository tests
        run: npm test
